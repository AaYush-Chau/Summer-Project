<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" preserveAspectRatio="xMaxYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="1130" cy="230" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E3A73A" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#F26B5E" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#16233B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="1450" cy="90" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4C6FA8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#16233B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#16233B" stop-opacity="1"/>
      <stop offset="0.42" stop-color="#16233B" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#16233B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0.8" stop-color="#16233B" stop-opacity="0"/>
      <stop offset="1" stop-color="#16233B" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F3E6D0"/>
      <stop offset="1" stop-color="#D9C6A8"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#D49A72"/>
      <stop offset="1" stop-color="#B9805C"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#F0B94A"/>
      <stop offset="1" stop-color="#D4922A"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" x2="1">
      <stop offset="0" stop-color="#B9693F"/>
      <stop offset="0.5" stop-color="#E39A6A"/>
      <stop offset="1" stop-color="#B9693F"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="420" fill="#16233B"/>
  <rect width="1600" height="420" fill="url(#glow)"/>
  <rect width="1600" height="420" fill="url(#glow2)"/>

  <!-- geometric accents -->
  <g fill="none" stroke="#F3E6D0" stroke-opacity="0.10" stroke-width="1.5">
    <circle cx="1130" cy="230" r="190"/>
    <circle cx="1130" cy="230" r="270"/>
    <circle cx="1130" cy="230" r="350" stroke-opacity="0.05"/>
  </g>
  <circle cx="1440" cy="70" r="46" fill="#E3A73A" fill-opacity="0.14"/>
  <circle cx="860" cy="340" r="26" fill="#F26B5E" fill-opacity="0.16"/>
  <circle cx="1500" cy="330" r="9" fill="#E3A73A" fill-opacity="0.5"/>
  <circle cx="900" cy="90" r="6" fill="#F3E6D0" fill-opacity="0.35"/>

  <!-- location pin motif -->
  <g transform="translate(1385 120)" opacity="0.9">
    <path d="M0 0c-26 0-44 18-44 42 0 30 44 70 44 70s44-40 44-70c0-24-18-42-44-42z" fill="#F26B5E" fill-opacity="0.9"/>
    <circle cx="0" cy="40" r="15" fill="#16233B"/>
    <circle cx="0" cy="40" r="6" fill="#E3A73A"/>
  </g>

  <!-- house outline -->
  <g fill="none" stroke="#F3E6D0" stroke-opacity="0.16" stroke-width="2" stroke-linejoin="round">
    <path d="M820 250 L905 190 L990 250 V330 H820 Z"/>
    <rect x="885" y="270" width="40" height="60"/>
  </g>

  <!-- copper pipes -->
  <g>
    <rect x="1330" y="250" width="200" height="16" rx="8" fill="url(#copper)"/>
    <rect x="1514" y="250" width="16" height="110" rx="8" fill="url(#copper)"/>
    <circle cx="1522" cy="258" r="13" fill="#B9693F"/>
    <rect x="1420" y="244" width="10" height="28" rx="3" fill="#8F4F2E"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="1130" cy="418" rx="260" ry="26" fill="#0B1424" opacity="0.5" filter="url(#soft)"/>

  <!-- torso -->
  <path d="M870 420 C880 352 945 322 1020 312 L1240 312 C1315 322 1380 352 1390 420 Z" fill="url(#shirt)"/>
  <!-- hi-vis stripes -->
  <path d="M940 420 L972 330 L1002 322 L972 420 Z" fill="#F26B5E" opacity="0.9"/>
  <path d="M1320 420 L1290 336 L1262 330 L1290 420 Z" fill="#F26B5E" opacity="0.9"/>
  <!-- collar -->
  <path d="M1088 312 L1130 372 L1172 312 Z" fill="#16233B" opacity="0.85"/>
  <path d="M1068 312 L1112 380 L1130 372 L1088 308 Z" fill="#EADBC4"/>
  <path d="M1192 312 L1148 380 L1130 372 L1172 308 Z" fill="#EADBC4"/>
  <!-- pocket + badge -->
  <rect x="1180" y="352" width="56" height="52" rx="6" fill="#16233B" fill-opacity="0.12"/>
  <circle cx="1208" cy="372" r="7" fill="#E3A73A"/>

  <!-- neck -->
  <path d="M1102 262 H1158 V318 C1146 336 1114 336 1102 318 Z" fill="#B9805C"/>

  <!-- arm holding wrench -->
  <path d="M1250 330 C1320 340 1350 380 1342 420 L1288 420 C1286 392 1272 372 1240 366 Z" fill="#EADBC4"/>
  <circle cx="1318" cy="408" r="0" fill="none"/>

  <!-- head -->
  <ellipse cx="1074" cy="226" rx="9" ry="16" fill="#B9805C"/>
  <ellipse cx="1186" cy="226" rx="9" ry="16" fill="#B9805C"/>
  <ellipse cx="1130" cy="222" rx="56" ry="66" fill="url(#skin)"/>
  <!-- hair sides -->
  <path d="M1076 196 C1070 214 1074 232 1080 240 C1082 224 1084 210 1090 198 Z" fill="#2B2018"/>
  <path d="M1184 196 C1190 214 1186 232 1180 240 C1178 224 1176 210 1170 198 Z" fill="#2B2018"/>
  <!-- eyebrows, eyes -->
  <path d="M1096 206 q14 -8 26 -1" stroke="#2B2018" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M1138 205 q12 -7 26 1" stroke="#2B2018" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="1109" cy="222" rx="5" ry="6" fill="#2B2018"/>
  <ellipse cx="1151" cy="222" rx="5" ry="6" fill="#2B2018"/>
  <circle cx="1111" cy="220" r="1.8" fill="#fff"/>
  <circle cx="1153" cy="220" r="1.8" fill="#fff"/>
  <!-- nose + smile -->
  <path d="M1130 226 q-6 18 2 22" stroke="#9A6444" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M1104 262 Q1130 286 1156 262" stroke="#7A3F2B" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M1110 266 Q1130 280 1150 266 Q1130 272 1110 266 Z" fill="#fff" opacity="0.9"/>

  <!-- hard hat -->
  <path d="M1066 186 C1066 124 1194 124 1194 186 Z" fill="url(#hat)"/>
  <rect x="1122" y="122" width="16" height="48" rx="6" fill="#F0B94A"/>
  <rect x="1050" y="182" width="160" height="14" rx="7" fill="#C9831F"/>
  <path d="M1086 150 C1100 134 1120 130 1130 130" stroke="#fff" stroke-opacity="0.45" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- wrench -->
  <g transform="rotate(-28 1320 360)">
    <rect x="1308" y="300" width="22" height="130" rx="9" fill="#C9D3E0"/>
    <path d="M1288 300 a32 32 0 1 1 64 0 l-18 0 v-14 h-28 v14 z" fill="#C9D3E0"/>
    <rect x="1310" y="310" width="6" height="110" rx="3" fill="#fff" opacity="0.35"/>
  </g>
  <!-- hand -->
  <ellipse cx="1318" cy="396" rx="26" ry="22" fill="url(#skin)"/>

  <!-- left fade for text legibility + edge safety -->
  <rect width="1600" height="420" fill="url(#fade)"/>
  <rect width="1600" height="420" fill="url(#bottomFade)"/>
</svg>
